[package]
name = "language_models"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/language_models.rs"
doctest = false

[features]
default = ["copilot", "hosted-llms", "zed-cloud"]
copilot = ["dep:copilot_chat", "dep:copilot_ui"]
hosted-llms = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws_http_client",
    "dep:base64",
    "dep:bedrock",
    "dep:deepseek",
    "dep:google_ai",
    "dep:mistral",
    "dep:openai_subscribed",
    "dep:opencode",
    "dep:open_router",
    "dep:sha2",
    "dep:x_ai",
    "dep:x_ai_subscribed",
]
zed-cloud = [
    "dep:ai_onboarding",
    "dep:cloud_api_client",
    "dep:cloud_api_types",
    "dep:language_models_cloud",
    "dep:rand",
]
test-support = []

[dependencies]
ai_onboarding = { workspace = true, optional = true }
anthropic = { workspace = true, features = ["schemars"] }
anyhow.workspace = true
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws_http_client = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bedrock = { workspace = true, features = ["schemars"], optional = true }
client.workspace = true
cloud_api_client = { workspace = true, optional = true }
cloud_api_types = { workspace = true, optional = true }
collections.workspace = true
component.workspace = true
convert_case.workspace = true
copilot_chat = { workspace = true, optional = true }
copilot_ui = { workspace = true, optional = true }
credentials_provider.workspace = true
deepseek = { workspace = true, features = ["schemars"], optional = true }
extension.workspace = true
extension_host.workspace = true
fs.workspace = true
futures.workspace = true
google_ai = { workspace = true, optional = true }
gpui.workspace = true
gpui_tokio.workspace = true
http_client.workspace = true
language_model.workspace = true
language_models_cloud = { workspace = true, optional = true }
llama_cpp = { workspace = true, features = ["schemars"] }
lmstudio = { workspace = true, features = ["schemars"] }
log.workspace = true
menu.workspace = true
mistral = { workspace = true, features = ["schemars"], optional = true }
ollama = { workspace = true, features = ["schemars"] }
open_ai = { workspace = true, features = ["schemars"] }
openai_subscribed = { workspace = true, optional = true }
opencode = { workspace = true, features = ["schemars"], optional = true }
open_router = { workspace = true, optional = true }
paths.workspace = true
rand = { workspace = true, optional = true }
release_channel.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
sha2 = { workspace = true, optional = true }
strum.workspace = true
ui.workspace = true
ui_input.workspace = true
util.workspace = true
x_ai = { workspace = true, features = ["schemars"], optional = true }
x_ai_subscribed = { workspace = true, optional = true }

[dev-dependencies]
client = { workspace = true, features = ["test-support"] }
clock = { workspace = true, features = ["test-support"] }
cloud_llm_client.workspace = true
db = { workspace = true, features = ["test-support"] }
feature_flags.workspace = true
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
language_model = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
settings = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-shear]
ignored = ["component"]
